[project]
name = "agent-skillctl"
version = "0.1.0"
description = "A sites-available/sites-enabled manager for agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "skillctl contributors" }]
dependencies = ["rich>=13.9", "textual>=0.80"]

[project.scripts]
agent-skillctl = "skillctl.cli:main"
skillctl = "skillctl.cli:main"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
files = ["src"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillctl"]
